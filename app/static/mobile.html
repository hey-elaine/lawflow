<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>声息 · 手机收听</title>
<style>
:root { --ink: #14251f; --muted: #6b766f; --accent: #1d5b49; --line: #e6e1d5; --bg: #f7f5ef; --card: #fffdf8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Noto Sans SC", "PingFang SC", sans-serif; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
header { padding: calc(18px + env(safe-area-inset-top)) 18px 14px; border-bottom: 1px solid var(--line); background: var(--card); }
header .brand { font-size: 12px; letter-spacing: .18em; color: var(--accent); font-weight: 600; }
header h1 { margin: 4px 0 2px; font-size: 21px; line-height: 1.35; }
header .meta { color: var(--muted); font-size: 13px; }
main { padding: 12px 14px; display: grid; gap: 10px; }
.chapter { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 13px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.chapter:active { background: #f1eee4; }
.chapter.playing { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(29,91,73,.12); }
.chapter .num { width: 34px; height: 34px; border-radius: 10px; background: #eceadf; color: var(--muted); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.chapter.playing .num { background: var(--accent); color: #fff; }
.chapter .info { min-width: 0; }
.chapter .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chapter .sub { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.chapter .bar { height: 3px; margin-top: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.chapter .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
.chip.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.learn-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 6px 2px; }
.learn-btn.done { color: var(--accent); font-weight: 600; }
.player { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.player .row { display: flex; align-items: center; gap: 12px; }
.player .now { min-width: 0; flex: 1; }
.player .now b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player .now small { color: var(--muted); font-size: 12px; }
.player button { border: 0; background: none; font-size: 22px; color: var(--ink); padding: 8px; }
.player .play { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 24px; }
.player .speed { font-size: 13px; color: var(--accent); font-weight: 600; }
.player .seek { width: 100%; margin-top: 8px; accent-color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 48px 24px; }
.error { text-align: center; padding: 64px 24px; color: var(--muted); }
.error b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 8px; }
a.dl { color: var(--muted); font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<header>
  <div class="brand">声息 · SHENGXI</div>
  <h1 id="book-title">加载中…</h1>
  <div class="meta" id="book-meta"></div>
</header>
<main id="list"><div class="empty">正在获取章节…</div></main>
<div class="player" id="player" hidden>
  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" />
  <div class="row">
    <button id="prev" aria-label="上一章">⏮</button>
    <button class="play" id="play" aria-label="播放">▶</button>
    <button id="next" aria-label="下一章">⏭</button>
    <div class="now"><b id="now-title"></b><small id="now-time">--:-- / --:--</small></div>
    <button class="speed" id="speed">1.0×</button>
    <a class="dl" id="dl" download>下载</a>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>
<script>
(function () {
  'use strict';
  var token = decodeURIComponent(location.pathname.split('/')[2] || '');
  var api = '/m/' + encodeURIComponent(token);
  var audio = document.getElementById('audio');
  var chapters = [];
  var current = -1;
  var speeds = [1, 1.25, 1.5, 2];
  var speedIndex = 0;

  function posKey(id) { return 'sx-pos:' + token + ':' + id; }
  function fmt(sec) {
    if (!isFinite(sec)) return '--:--';
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }
  function $(id) { return document.getElementById(id); }

  function renderList() {
    var list = $('list');
    if (!chapters.length) { list.innerHTML = '<div class="empty">这本书还没有已合成的音频。<br/>回到电脑端「音频与导出」先生成。</div>'; return; }
    list.innerHTML = '';
    chapters.forEach(function (ch, index) {
      var pos = Number(localStorage.getItem(posKey(ch.id)) || 0);
      var pct = ch.duration_seconds ? Math.min(100, Math.round(pos / ch.duration_seconds * 100)) : 0;
      var row = document.createElement('div');
      row.className = 'chapter' + (index === current ? ' playing' : '');
      row.dataset.index = index;
      row.innerHTML = '<div class="num">' + (index + 1) + '</div>' +
        '<div class="info"><div class="title"></div><div class="sub"><span>' + fmt(ch.duration_seconds) + '</span>' +
        (ch.chapter ? '' : '<span class="chip">整篇</span>') +
        '<span class="chip' + (ch.learned ? ' done' : '') + '" data-learn>' + (ch.learned ? '已学' : '未学') + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>' +
        '<button class="learn-btn' + (ch.learned ? ' done' : '') + '" data-learn-btn>' + (ch.learned ? '✓ 已学' : '标记已学') + '</button>';
      row.querySelector('.title').textContent = ch.title;
      row.addEventListener('click', function (event) {
        if (event.target.hasAttribute('data-learn-btn')) return;
        play(index);
      });
      row.querySelector('[data-learn-btn]').addEventListener('click', function () { toggleLearn(index); });
      list.appendChild(row);
    });
  }

  function refreshRow(index) {
    var rows = document.querySelectorAll('.chapter');
    if (rows[index]) rows[index].classList.toggle('playing', index === current);
  }

  function play(index) {
    if (index < 0 || index >= chapters.length) return;
    var ch = chapters[index];
    current = index;
    audio.src = api + '/audio/' + encodeURIComponent(ch.id);
    audio.playbackRate = speeds[speedIndex];
    var resume = Number(localStorage.getItem(posKey(ch.id)) || 0);
    if (resume > 2 && (!ch.duration_seconds || resume < ch.duration_seconds - 3)) audio.currentTime = resume;
    audio.play().catch(function () {});
    $('now-title').textContent = (index + 1) + '. ' + ch.title;
    $('dl').href = api + '/audio/' + encodeURIComponent(ch.id) + '?download=1';
    document.querySelectorAll('.chapter').forEach(function (row, i) { row.classList.toggle('playing', i === index); });
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: ch.title, artist: $('book-title').textContent, album: '声息' });
    }
  }

  function toggleLearn(index) {
    var ch = chapters[index];
    fetch(api + '/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ audio_id: ch.id, completed: !ch.learned }) })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.saved) { ch.learned = !ch.learned; renderList(); if (current >= 0) refreshRow(current); }
      }).catch(function () {});
  }

  function step(delta) {
    if (!chapters.length) return;
    var next = (current + delta + chapters.length) % chapters.length;
    play(next);
  }

  fetch(api + '/data').then(function (res) {
    if (!res.ok) throw new Error('链接已失效');
    return res.json();
  }).then(function (data) {
    $('book-title').textContent = data.title;
    var meta = [];
    if (data.total) meta.push('已学 ' + data.learned_count + ' / ' + data.total + ' 章');
    meta.push(data.whole_book.length ? '含整篇音频' : '共 ' + data.total + ' 章');
    $('book-meta').textContent = meta.join(' · ');
    chapters = data.chapters.concat(data.whole_book);
    renderList();
    if (chapters.length) { $('player').hidden = false; current = -1; }
  }).catch(function (error) {
    $('list').innerHTML = '<div class="error"><b>无法打开</b>链接不存在、已过期或已被吊销。请回到电脑端重新生成二维码。</div>';
  });

  $('play').addEventListener('click', function () {
    if (current < 0) { play(0); return; }
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  });
  audio.addEventListener('play', function () { $('play').textContent = '⏸'; });
  audio.addEventListener('pause', function () { $('play').textContent = '▶'; });
  audio.addEventListener('ended', function () {
    if (current < chapters.length - 1) play(current + 1);
  });
  $('prev').addEventListener('click', function () { step(-1); });
  $('next').addEventListener('click', function () { step(1); });
  $('speed').addEventListener('click', function () {
    speedIndex = (speedIndex + 1) % speeds.length;
    audio.playbackRate = speeds[speedIndex];
    $('speed').textContent = speeds[speedIndex].toFixed(speeds[speedIndex] % 1 ? 2 : 1).replace(/0$/, '') + '×';
    localStorage.setItem('sx-speed', String(speedIndex));
  });
  var savedSpeed = Number(localStorage.getItem('sx-speed') || 0);
  if (savedSpeed > 0 && savedSpeed < speeds.length) { speedIndex = savedSpeed; audio.playbackRate = speeds[speedIndex]; $('speed').textContent = speeds[speedIndex] + '×'; }

  var lastSave = 0;
  audio.addEventListener('timeupdate', function () {
    if (current < 0) return;
    var ch = chapters[current];
    $('now-time').textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration || ch.duration_seconds);
    $('seek').value = audio.duration ? String(Math.round(audio.currentTime / audio.duration * 1000)) : '0';
    var now = Date.now();
    if (now - lastSave > 3000) {
      lastSave = now;
      localStorage.setItem(posKey(ch.id), String(audio.currentTime));
      var rows = document.querySelectorAll('.chapter');
      if (rows[current]) {
        var pct = ch.duration_seconds ? Math.min(100, Math.round(audio.currentTime / ch.duration_seconds * 100)) : 0;
        var bar = rows[current].querySelector('.bar i');
        if (bar) bar.style.width = pct + '%';
      }
    }
  });
  $('seek').addEventListener('input', function () {
    if (audio.duration) audio.currentTime = Number($('seek').value) / 1000 * audio.duration;
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('previoustrack', function () { step(-1); });
    navigator.mediaSession.setActionHandler('nexttrack', function () { step(1); });
    navigator.mediaSession.setActionHandler('play', function () { audio.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { audio.pause(); });
  }
})();
</script>
</body>
</html>
